services:
  mydays:
    build:
      context: .
      dockerfile: Dockerfile
    image: mydays:local
    ports:
      - "127.0.0.1:${MYDAYS_PORT:-4173}:3000"
    environment:
      MYDAYS_ACCESS_PASSWORD_FILE: /run/secrets/mydays_access_password
      AI_ALLOW_PROXY_FAKE_IP: "1"
    secrets:
      - mydays_access_password
    volumes:
      - mydays_data:/app/data
    restart: unless-stopped

  # Optional: reads local AI agent session files for the "Agent 工作汇总" feature.
  # Start it with: docker compose --profile agent-digest up -d
  collector:
    image: mydays:local
    profiles: ["agent-digest"]
    command: ["node", "collector/collector.mjs"]
    depends_on:
      - mydays
    environment:
      MYDAYS_URL: http://mydays:3000
      MYDAYS_TOKEN_FILE: /app/data/.collector-token
      CLAUDE_PROJECTS_DIR: /sources/claude
      CODEX_SESSIONS_DIR: /sources/codex
      COLLECTOR_STATE_DIR: /state
    volumes:
      - mydays_data:/app/data:ro
      - ${MYDAYS_CLAUDE_DIR:-~/.claude/projects}:/sources/claude:ro
      - ${MYDAYS_CODEX_DIR:-~/.codex/sessions}:/sources/codex:ro
      - collector_state:/state
    healthcheck:
      disable: true
    restart: unless-stopped

secrets:
  mydays_access_password:
    file: ./secrets/mydays_access_password.txt

volumes:
  mydays_data:
    name: "${MYDAYS_VOLUME:-mydays_data}"
  collector_state:
